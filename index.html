<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Loadout Draw — Room</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap');

    :root {
      --ink: #0E1013;
      --panel: #16191D;
      --panel-raised: #1D2126;
      --line: #2B3038;
      --paper: #ECE8E1;
      --paper-dim: #8B9096;
      --red: #FF4655;
      --red-dim: #6B2229;
      --teal: #5FA8A0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--ink);
      color: var(--paper);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding: 28px 16px 60px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    h1,
    h2,
    h3 {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      margin: 0;
    }

    .masthead {
      border-bottom: 2px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }

    .masthead h1 {
      font-size: clamp(26px, 5vw, 36px);
      letter-spacing: 0.5px;
    }

    .masthead h1 span {
      color: var(--red);
    }

    .masthead p {
      color: var(--paper-dim);
      margin: 6px 0 0;
      font-size: 14px;
    }

    /* ---- generic panel ---- */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 22px;
      margin-bottom: 16px;
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent, var(--red));
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--paper-dim);
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      background: var(--ink);
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 12px;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--red);
    }

    .btn {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 15px;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      color: var(--ink);
      background: var(--red);
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }

    .btn:hover {
      background: #ff5d6a;
    }

    .btn:disabled {
      background: var(--line);
      color: var(--paper-dim);
      cursor: not-allowed;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--paper);
      clip-path: none;
    }

    .btn.secondary:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .btn.ghost {
      background: transparent;
      border: none;
      color: var(--paper-dim);
      clip-path: none;
      text-decoration: underline;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 0;
    }

    .btn.ghost:hover {
      color: var(--paper);
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row>* {
      flex: 1;
    }

    .error {
      color: var(--red);
      font-size: 14px;
      margin-top: 8px;
    }

    .hint {
      color: var(--paper-dim);
      font-size: 13px;
      margin-top: 10px;
    }

    /* ---- landing tabs ---- */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--paper-dim);
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 12px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .tab-btn.active {
      border-color: var(--red);
      color: var(--paper);
      background: var(--panel-raised);
    }

    /* ---- room code display ---- */
    .code-display {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      padding: 16px 20px;
      margin-bottom: 18px;
    }

    .code-display .code {
      font-family: 'Oswald', sans-serif;
      font-size: 30px;
      letter-spacing: 6px;
      font-weight: 600;
    }

    .code-display .code-label {
      font-size: 12px;
      color: var(--paper-dim);
      letter-spacing: 1px;
    }

    .copy-code-btn {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--paper);
      padding: 8px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .copy-code-btn:hover {
      border-color: var(--teal);
      color: var(--teal);
    }

    .copy-code-btn.copied {
      border-color: var(--teal);
      color: var(--teal);
    }

    .copy-code-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* ---- player grid ---- */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 16px 0;
    }

    @media (max-width:560px) {
      .player-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .slot {
      border: 1px solid var(--line);
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-raised);
    }

    .slot.filled {
      border-color: var(--teal);
      color: var(--paper);
      font-weight: 600;
    }

    .slot.host-slot {
      border-color: var(--red);
    }

    .slot.empty {
      color: var(--line);
    }

    .progress-label {
      font-size: 14px;
      color: var(--paper-dim);
      margin-bottom: 4px;
    }

    /* ---- config rows ---- */
    .config-row {
      display: grid;
      grid-template-columns: 100px 1fr 1fr;
      gap: 10px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .config-row:last-child {
      border-bottom: none;
    }

    @media (max-width:600px) {
      .config-row {
        grid-template-columns: 1fr;
      }
    }

    .config-row .cat-name {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 15px;
    }

    .mini-toggle {
      display: flex;
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .mini-toggle button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--paper-dim);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      padding: 7px 6px;
      cursor: pointer;
    }

    .mini-toggle button.active {
      background: var(--teal);
      color: var(--ink);
    }

    .waiting-box {
      text-align: center;
      padding: 30px 10px;
      color: var(--paper-dim);
    }

    .waiting-box .pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
      display: inline-block;
      margin-right: 8px;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.25;
      }
    }

    .readonly-config {
      font-size: 14px;
      color: var(--paper-dim);
    }

    .readonly-config div {
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
    }

    .readonly-config div:last-child {
      border-bottom: none;
    }

    .readonly-config .v {
      color: var(--paper);
      font-weight: 600;
    }

    /* ---- result ticket ---- */
    .ticket {
      background: var(--panel-raised);
      border: 1px solid var(--line);
      padding: 26px 22px;
    }

    .ticket-rows {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-top: 10px;
    }

    @media (max-width:620px) {
      .ticket-rows {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .ticket-item {
      padding: 10px 16px;
      border-left: 1px solid var(--line);
    }

    .ticket-item:first-child {
      border-left: none;
      padding-left: 0;
    }

    @media (max-width:620px) {
      .ticket-item:nth-child(odd) {
        border-left: none;
        padding-left: 0;
      }
    }

    .ticket-item .tag {
      font-size: 12px;
      color: var(--paper-dim);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .ticket-item .val {
      font-family: 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 500;
    }

    .ticket-item .sub {
      font-size: 13px;
      color: var(--paper-dim);
      margin-top: 2px;
    }

    .small-note {
      font-size: 12px;
      color: var(--line);
      text-align: center;
      margin-top: 24px;
    }

    .you-tag {
      display: inline-block;
      font-size: 10px;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 1px 5px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ---- per-player result cards ---- */
    .player-results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width:560px) {
      .player-results {
        grid-template-columns: 1fr;
      }
    }

    .player-result {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--teal);
      padding: 12px 14px;
    }

    .pr-name {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .pr-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      border-top: 1px solid var(--line);
    }

    .pr-row:first-of-type {
      border-top: none;
    }

    .pr-tag {
      font-size: 11px;
      color: var(--paper-dim);
      letter-spacing: 1px;
      width: 56px;
      flex-shrink: 0;
    }

    .pr-val {
      font-family: 'Oswald', sans-serif;
      font-weight: 500;
      font-size: 15px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pr-sub {
      font-size: 12px;
      color: var(--paper-dim);
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .side-tag {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.5px;
      border: 1px solid var(--line);
      padding: 1px 6px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .side-tag.side-attacker {
      border-color: var(--red);
      color: var(--red);
    }

    .side-tag.side-defender {
      border-color: var(--teal);
      color: var(--teal);
    }

    .player-result.side-attacker {
      border-left-color: var(--red);
    }

    .player-result.side-defender {
      border-left-color: var(--teal);
    }

    .config-row.is-off {
      opacity: 0.55;
    }

    /* ---- option icons: small colored monogram badges ---- */
    .opt-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-right: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 9px;
      letter-spacing: 0;
      background: var(--panel);
      border: 1px solid var(--icon-color);
      color: var(--icon-color);
      vertical-align: middle;
    }

    .opt-icon-circle {
      border-radius: 50%;
    }

    .opt-icon-square {
      border-radius: 3px;
    }

    .opt-icon-diamond {
      border-radius: 3px;
      transform: rotate(45deg);
    }

    .opt-icon-diamond .opt-icon-label {
      display: inline-block;
      transform: rotate(-45deg);
    }

    img.opt-icon-agent {
      border-color: var(--line);
      object-fit: cover;
      padding: 0;
      background: var(--panel);
    }

    img.opt-icon-role {
      border-color: var(--line);
      object-fit: cover;
      padding: 0;
      background: var(--panel);
    }

    /* ---- per-player manual assignment: drag-and-drop ---- */
    .manual-dnd-hint {
      font-size: 12px;
      color: var(--paper-dim);
      margin: 0 0 8px;
    }

    .manual-options-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--line);
    }

    .option-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .option-chip:hover {
      border-color: var(--paper-dim);
    }

    .option-chip.selected {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-dim);
    }

    .option-chip.dragging {
      opacity: 0.4;
    }

    .manual-player-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .manual-drop-zone {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px dashed var(--line);
      padding: 6px 8px;
      cursor: pointer;
    }

    .manual-drop-zone.filled {
      border-style: solid;
      background: var(--panel-raised);
    }

    .manual-drop-zone.drag-over {
      border-color: var(--red);
      background: var(--red-dim);
    }

    .manual-drop-zone .mpr-name {
      flex: 0 0 108px;
      font-size: 13px;
      color: var(--paper-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .manual-drop-zone .mpr-value {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--paper-dim);
    }

    .manual-drop-zone.filled .mpr-value {
      color: var(--paper);
    }

    .manual-drop-zone .mpr-clear {
      background: none;
      border: none;
      color: var(--paper-dim);
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
      cursor: pointer;
    }

    .manual-drop-zone .mpr-clear:hover {
      color: var(--red);
    }

    /* ---- map manual selection: clickable tiles ---- */
    .map-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .map-tile {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      color: var(--paper);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 10px;
      cursor: pointer;
    }

    .map-tile:hover {
      border-color: var(--paper-dim);
    }

    .map-tile.selected {
      border-color: var(--red);
      color: var(--red);
      background: var(--red-dim);
    }

    @media (min-width:601px) {
      .config-row.manual-expanded {
        grid-template-columns: 100px 1fr;
      }

      .config-row.manual-expanded>div:last-child {
        grid-column: 1 / -1;
        margin-top: 10px;
      }
    }

    /* ---- language switcher ---- */
    .lang-switch {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .lang-switch button {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--paper-dim);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .lang-switch button.active {
      border-color: var(--red);
      color: var(--paper);
      background: var(--panel-raised);
    }

    .lang-switch button:hover {
      color: var(--paper);
    }

    /* ---- result: attackers left / defenders right ---- */
    .side-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 10px;
    }

    @media (max-width:560px) {
      .side-columns {
        grid-template-columns: 1fr;
      }
    }

    .side-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .side-col-heading {
      font-family: 'Oswald', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .side-col-heading.side-attacker {
      color: var(--red);
      border-color: var(--red);
    }

    .side-col-heading.side-defender {
      color: var(--teal);
      border-color: var(--teal);
    }

    .result-heading {
      color: var(--paper-dim);
      font-size: 14px;
      letter-spacing: 1.5px;
    }

    /* Letter-spacing tuned for short, all-caps English labels (ROLE,
       ATTACKERS, RESULT IS IN, etc.) reads as oversized/spaced-out on
       Japanese text, since CJK glyphs already fill their full character
       box — most noticeably on the role label/heading in the result
       screen. Tighten it back down for Japanese specifically. */
    :lang(ja) .pr-tag,
    :lang(ja) .ticket-item .tag,
    :lang(ja) .side-col-heading,
    :lang(ja) .result-heading {
      letter-spacing: 0;
    }
  </style>
</head>

<body>
  <div class="wrap" id="app"></div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    /* ---------------- supabase ---------------- */
    // Public/publishable (anon) key — safe to ship in client code as long as
    // Row Level Security policies on the `rooms` table are what actually
    // gate access (see the SQL migration this was set up with).
    const SUPABASE_URL = "https://ydlipcddluppspokcpvq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_L5-CFrPnH6WJLkJUv1jBKg_QpyK0ghl";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ---------------- data ---------------- */
    const DATA = {
      sides: ["Attacker", "Defender"],
      maps: ["Ascent", "Bind", "Haven", "Split", "Icebox", "Breeze", "Fracture", "Pearl", "Lotus", "Sunset", "Abyss", "Corrode"],
      roles: {
        "Duelist": ["Jett", "Phoenix", "Reyna", "Raze", "Yoru", "Neon", "Iso", "Waylay"],
        "Initiator": ["Sova", "Breach", "Skye", "KAY/O", "Fade", "Gekko", "Tejo"],
        "Controller": ["Brimstone", "Viper", "Omen", "Astra", "Harbor", "Clove"],
        "Sentinel": ["Killjoy", "Cypher", "Sage", "Chamber", "Deadlock", "Vyse"]
      },
      weaponTypes: {
        "Sidearm": ["Classic", "Shorty", "Frenzy", "Ghost", "Sheriff"],
        "SMG": ["Stinger", "Spectre"],
        "Shotgun": ["Bucky", "Judge"],
        "Rifle": ["Bulldog", "Guardian", "Phantom", "Vandal"],
        "Sniper Rifle": ["Marshal", "Outlaw", "Operator"],
        "Machine Gun": ["Ares", "Odin"]
      }
    };
    const AGENT_ROLE = {};
    Object.entries(DATA.roles).forEach(([role, agents]) => agents.forEach(a => AGENT_ROLE[a] = role));
    const WEAPON_TYPE = {};
    Object.entries(DATA.weaponTypes).forEach(([type, weapons]) => weapons.forEach(w => WEAPON_TYPE[w] = type));
    const ALL_AGENTS = Object.keys(AGENT_ROLE);
    const ALL_WEAPONS = Object.keys(WEAPON_TYPE);
    const MAX_PLAYERS = 10;

    /* ---------------- i18n ---------------- */
    // Agent, weapon, and map names are kept as their official English
    // names in every language (as Valorant itself mostly does in-game).
    // Only interface copy and the broader category names are translated.
    const STRINGS = {
      en: {
        subtitle: "Create a room and share the code, or join one your host gave you.",
        tabCreate: "Create room",
        tabJoin: "Join room",
        yourNickname: "Your nickname",
        nicknamePlaceholder: "e.g. Jett_Main",
        createRoomBtn: "Create room",
        roomCodeField: "Room code",
        joinRoomBtn: "Join room",
        errNickname: "Enter a nickname first.",
        errCode: "Enter a room code.",
        errNoRoom: "No room found with that code.",
        errAlreadyStarted: "That room has already started.",
        errFull: "That room is full.",
        errCreateFail: "Couldn't create the room. Try again.",
        errJoinFail: "Couldn't join the room. Try again.",
        creating: "Creating…",
        joining: "Joining…",
        roomCodeShare: "ROOM CODE — SHARE THIS",
        copyCode: "Copy",
        copyCodeCopied: "Copied!",
        joined: (n, max) => `${n} / ${max} joined`,
        open: "Open",
        you: "YOU",
        setupRandomizer: "Set up randomizer",

    };

    function t(key, ...args) {
      const dict = STRINGS[local.lang] || STRINGS.en;
      const entry = dict[key] !== undefined ? dict[key] : STRINGS.en[key];
      return typeof entry === "function" ? entry(...args) : entry;
    }

    // Translates a raw stored value (which is always the English game name,
    // used internally for logic/CSS classes) into the current display
    // language.
    function translateOption(category, subMode, value) {
      if (!value) return value;
      if (category === "side") return (SIDE_LABELS[local.lang] && SIDE_LABELS[local.lang][value]) || value;
      if (category === "role") {
        return subMode === "agent"
          ? (AGENT_LABELS[local.lang] && AGENT_LABELS[local.lang][value]) || value
          : (ROLE_LABELS[local.lang] && ROLE_LABELS[local.lang][value]) || value;
      }
      if (category === "weapon") {
        return subMode === "weapon"
          ? (WEAPON_LABELS[local.lang] && WEAPON_LABELS[local.lang][value]) || value
          : (WEAPON_TYPE_LABELS[local.lang] && WEAPON_TYPE_LABELS[local.lang][value]) || value;
      }
      if (category === "map") return (MAP_LABELS[local.lang] && MAP_LABELS[local.lang][value]) || value;
      return value;
    }

    // ---- iconography for options ----
    // Only role-category options (agents and role groups) get a visual
    // icon, sourced from images/agents/ and images/roles/ respectively.
    // Side, weapon, and map options are shown as plain text with no icon.
    function optionIcon(category, subMode, value) {
      if (!value) return "";
      if (category === "role" && subMode === "agent") {
        const slug = agentImageSlug(value);
        return `<img class="opt-icon opt-icon-circle opt-icon-agent" src="images/agents/${slug}.webp" alt="${escapeHtml(value)}" aria-hidden="true">`;
      }
      if (category === "role" && subMode === "role") {
        const slug = roleImageSlug(value);
        return `<img class="opt-icon opt-icon-circle opt-icon-role" src="images/roles/${slug}.webp" alt="${escapeHtml(value)}" aria-hidden="true">`;
      }
      return "";
    }

    // Maps an agent name to the filename (without extension) used under
    // images/agents/. KAY/O's slash isn't filename-safe, so that one agent
    // uses "kay:o" instead; every other agent is just its lowercase name.
    function agentImageSlug(agent) {
      if (agent === "KAY/O") return "kay:o";
      return agent.toLowerCase();
    }

    // Maps a role name (Duelist, Initiator, Controller, Sentinel) to the
    // filename (without extension) used under images/roles/.
    function roleImageSlug(role) {
      return role.toLowerCase();
    }

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function roomKey(code) { return "room:" + code; }
    function genCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let s = "";
      for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }
    function defaultConfig() {
      return {
        // side/role/weapon: "manual" mode is assigned per player, via
        // manualValues keyed by player id. map stays a single room-wide value.
        side: { mode: "random", manualValues: {} },
        role: { mode: "random", subMode: "role", manualValues: {} },
        weapon: { mode: "random", subMode: "type", manualValues: {} },
        map: { mode: "random", value: null }
      };
    }

    function detectSavedLang() {
      try {
        const saved = localStorage.getItem("loadoutDrawLang");
        if (saved && STRINGS[saved]) return saved;
      } catch (e) { /* ignore (e.g. storage disabled) */ }
      return "en";
    }

    /* ---------------- local (in-memory) state ---------------- */
    const local = {
      screen: "landing",      // landing | in-room
      tab: "create",          // create | join
      nickname: "",
      joinCode: "",
      playerId: null,
      roomCode: null,
      isHost: false,
      room: null,
      error: "",
      pollTimer: null,
      lang: detectSavedLang(),
      busy: false,        // true while a create/join request is in flight, to block spam-clicks
      lastHeartbeatWrite: null,  // timestamp of the last heartbeat write, so a fresh rejoin doesn't immediately re-fire one
      selectedChip: null  // { category, value } — an option "picked up" via tap, waiting for a player tap to land on
    };

    function setLang(lang) {
      if (!STRINGS[lang]) return;
      local.lang = lang;
      try { localStorage.setItem("loadoutDrawLang", lang); } catch (e) { /* ignore */ }
      render();
    }

    function langSwitcherHtml() {
      return `
    <div class="lang-switch" data-lang-switch>
      <button data-lang="en" class="${local.lang === "en" ? "active" : ""}">EN</button>
      <button data-lang="ja" class="${local.lang === "ja" ? "active" : ""}">日本語</button>
      <button data-lang="ko" class="${local.lang === "ko" ? "active" : ""}">한국어</button>
    </div>
  `;
    }

    function bindLangSwitch() {
      document.querySelectorAll("[data-lang-switch] button").forEach(btn => {
        btn.addEventListener("click", () => setLang(btn.dataset.lang));
      });
    }

    /* ---------------- storage helpers ----------------
       Rooms live in a Supabase `rooms` table: `code` (text, primary key)
       and `data` (jsonb, the full room object). See the SQL migration
       provided alongside this file for schema + RLS policies. */
    async function readRoom(code) {
      try {
        const { data, error } = await supabase
          .from("rooms")
          .select("data")
          .eq("code", code)
          .maybeSingle();
        if (error || !data) return null;
        return data.data || null;
      } catch (e) {
        return null;
      }
    }
    async function writeRoom(room) {
      room.updatedAt = Date.now();
      try {
        const { error } = await supabase
          .from("rooms")
          .upsert(
            { code: room.code, data: room, updated_at: new Date().toISOString() },
            { onConflict: "code" }
          );
        return !error;
      } catch (e) {
        return false;
      }
    }

    /* ---------------- actions ---------------- */
    // Player-id bookkeeping, keyed by room code. Uses localStorage (not
    // sessionStorage) so it survives closing and reopening the tab, not
    // just an in-tab refresh — this is what lets a rejoin/reconnect find
    // the same player slot again later. It also still covers the original
    // case of a retried/duplicated join submission (double-click, slow
    // network, accidental resubmit) reconnecting as the same player
    // instead of adding a second copy.
    function playerSessionKey(code) { return `loadoutDrawPlayer:${code}`; }
    function getStoredPlayerId(code) {
      try { return localStorage.getItem(playerSessionKey(code)); } catch (e) { return null; }
    }
    function setStoredPlayerId(code, id) {
      try { localStorage.setItem(playerSessionKey(code), id); } catch (e) { /* ignore */ }
    }
    function clearStoredPlayerId(code) {
      try { localStorage.removeItem(playerSessionKey(code)); } catch (e) { /* ignore */ }
    }

    // Tracks which room this browser is currently "in", so a page load with
    // no other context knows which room to try to reconnect to. Stored in
    // both sessionStorage (so a plain refresh in this exact tab always wins,
    // even if other tabs are in different rooms) and localStorage (so a
    // freshly reopened tab, which has no sessionStorage, can still fall back
    // to the last room this browser was active in).
    const ACTIVE_ROOM_KEY = "loadoutDrawActiveRoom";
    function setActiveRoomCode(code) {
      try { sessionStorage.setItem(ACTIVE_ROOM_KEY, code); } catch (e) { /* ignore */ }
      try { localStorage.setItem(ACTIVE_ROOM_KEY, code); } catch (e) { /* ignore */ }
    }
    function getActiveRoomCode() {
      try {
        const fromTab = sessionStorage.getItem(ACTIVE_ROOM_KEY);
        if (fromTab) return fromTab;
      } catch (e) { /* ignore */ }
      try { return localStorage.getItem(ACTIVE_ROOM_KEY); } catch (e) { return null; }
    }
    function clearActiveRoomCode() {
      try { sessionStorage.removeItem(ACTIVE_ROOM_KEY); } catch (e) { /* ignore */ }
      try { localStorage.removeItem(ACTIVE_ROOM_KEY); } catch (e) { /* ignore */ }
    }

    async function createRoom() {
      // `local.busy` is set synchronously (before any await), so a rapid
      // second click/tap re-enters this function before the first request
      // finishes and is bounced here rather than creating a second room.
      if (local.busy) return;
      const nickname = local.nickname.trim();
      if (!nickname) { local.error = t('errNickname'); render(); return; }
      local.busy = true;
      local.error = "";
      render();
      try {
        const id = crypto.randomUUID();
        const code = genCode();
        const room = {
          code,
          hostId: id,
          createdAt: Date.now(),
          players: [{ id, nickname }],
          phase: "lobby",
          config: defaultConfig(),
          result: null
        };
        const ok = await writeRoom(room);
        if (!ok) { local.error = t('errCreateFail'); return; }
        setStoredPlayerId(code, id);
        setActiveRoomCode(code);
        local.playerId = id;
        local.roomCode = code;
        local.isHost = true;
        local.room = room;
        local.screen = "in-room";
        local.error = "";
        startPolling();
      } finally {
        local.busy = false;
        render();
      }
    }

    async function joinRoom() {
      if (local.busy) return;
      const nickname = local.nickname.trim();
      const code = local.joinCode.trim().toUpperCase();
      if (!nickname) { local.error = t('errNickname'); render(); return; }
      if (!code) { local.error = t('errCode'); render(); return; }
      local.busy = true;
      local.error = "";
      render();
      try {
        const room = await readRoom(code);
        if (!room) { local.error = t('errNoRoom'); return; }
        if (room.phase !== "lobby") { local.error = t('errAlreadyStarted'); return; }

        // If this tab already joined this exact room (e.g. the click fired
        // twice, or a flaky connection caused a retry), reuse that same
        // player slot instead of adding another one.
        const storedId = getStoredPlayerId(code);
        const existing = storedId && room.players.find(p => p.id === storedId);
        let id;
        if (existing) {
          id = existing.id;
        } else {
          if (room.players.length >= MAX_PLAYERS) { local.error = t('errFull'); return; }
          id = crypto.randomUUID();
          room.players.push({ id, nickname });
          const ok = await writeRoom(room);
          if (!ok) { local.error = t('errJoinFail'); return; }
        }
        setStoredPlayerId(code, id);
        setActiveRoomCode(code);

        // Re-fetch the room from the server rather than trusting our own
        // optimistic copy of it. If the write above didn't actually persist
        // (auth/permissions issue, dropped write, stale cache, etc.) this
        // catches it here as a visible error instead of silently showing a
        // player list that doesn't match what the server actually has.
        const confirmedRoom = await readRoom(code);
        if (!confirmedRoom || !confirmedRoom.players.find(p => p.id === id)) {
          clearStoredPlayerId(code);
          clearActiveRoomCode();
          local.error = t('errJoinFail');
          return;
        }

        local.playerId = id;
        local.roomCode = code;
        local.isHost = false;
        local.room = confirmedRoom;
        local.screen = "in-room";
        local.error = "";
        startPolling();
      } finally {
        local.busy = false;
        render();
      }
    }

    async function refreshRoom() {
      if (!local.roomCode) return;
      const room = await readRoom(local.roomCode);
      if (room) local.room = room;
    }

    function startPolling() {
      if (local.pollTimer) clearInterval(local.pollTimer);
      local.pollTimer = setInterval(async () => {
        await refreshRoom();
        render();
      }, 1800);
    }

    async function goToConfig() {
      if (!local.isHost) return;
      const room = local.room;
      room.phase = "configuring";
      await writeRoom(room);
      local.room = room;
      render();
    }

    async function updateConfigMode(category, mode) {
      const room = local.room;
      room.config[category].mode = mode;
      // "map" is still a single room-wide value; side/role/weapon keep their
      // manualValues around so switching back to Manual restores selections.
      if (category === "map" && mode !== "manual") room.config[category].value = null;
      await writeRoom(room);
      local.room = room;
      render();
    }

    async function updateConfigSubMode(category, subMode) {
      const room = local.room;
      room.config[category].subMode = subMode;
      room.config[category].value = null;
      room.config[category].manualValues = {}; // pool changed, old picks no longer valid
      await writeRoom(room);
      local.room = room;
      render();
    }

    async function updateConfigValue(category, value) {
      const room = local.room;
      room.config[category].value = value;
      await writeRoom(room);
      local.room = room;
      render();
    }

    async function updateConfigManualValue(category, playerId, value) {
      const room = local.room;
      if (!room.config[category].manualValues) room.config[category].manualValues = {};
      room.config[category].manualValues[playerId] = value;
      await writeRoom(room);
      local.room = room;
      render();
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Assigns `count` values drawn from `pool`, guaranteeing no repeats until
    // the whole pool has been used once (then reshuffles and continues), so
    // results are as spread-out as possible even when players > pool size.
    function assignDistinct(pool, count) {
      const out = [];
      let bag = [];
      for (let i = 0; i < count; i++) {
        if (bag.length === 0) bag = shuffle(pool);
        out.push(bag.pop());
      }
      return out;
    }

    // Splits players into two teams as evenly as possible (5/5 for a full
    // 10-player room) and randomly decides which team is Attacker vs Defender.
    function assignBalancedSides(players) {
      const shuffled = shuffle(players);
      const n = shuffled.length;
      const firstCount = Math.ceil(n / 2);
      const sideOrder = shuffle(DATA.sides);
      const bySide = {};
      shuffled.forEach((p, i) => {
        bySide[p.id] = i < firstCount ? sideOrder[0] : sideOrder[1];
      });
      return players.map(p => bySide[p.id]);
    }

    function rollResult(config, players) {
      const result = { players: [] };

      // Side: "Off" excludes it from the draw entirely. "Manual" lets the
      // host assign each player's side individually (any player left
      // unassigned falls back to a random side so the draw still completes).
      // Otherwise, teams are split into a balanced 5/5 (for a full room).
      let sideAssignments;
      if (config.side.mode === "off") {
        sideAssignments = players.map(() => null);
      } else if (config.side.mode === "manual") {
        sideAssignments = players.map(p => (config.side.manualValues && config.side.manualValues[p.id]) || pick(DATA.sides));
      } else {
        sideAssignments = assignBalancedSides(players);
      }

      // Map is shared by the whole room. "Off" excludes it from the draw.
      result.map = config.map.mode === "off"
        ? null
        : (config.map.mode === "manual" && config.map.value ? config.map.value : pick(DATA.maps));

      // Role: "Manual" lets the host assign each player's role/agent
      // individually (unassigned players get a random pick from the pool).
      // Random = every player gets a different role/agent (cycling once the pool runs out).
      // Off = excluded from the draw entirely.
      let roleAssignments;
      result.roleSubMode = config.role.mode === "off" ? null : config.role.subMode;
      if (config.role.mode === "off") {
        roleAssignments = players.map(() => null);
      } else {
        const pool = config.role.subMode === "agent" ? ALL_AGENTS : Object.keys(DATA.roles);
        if (config.role.mode === "manual") {
          roleAssignments = players.map(p => (config.role.manualValues && config.role.manualValues[p.id]) || pick(pool));
        } else {
          roleAssignments = assignDistinct(pool, players.length);
        }
      }

      // Weapon: same idea as role.
      let weaponAssignments;
      result.weaponSubMode = config.weapon.mode === "off" ? null : config.weapon.subMode;
      if (config.weapon.mode === "off") {
        weaponAssignments = players.map(() => null);
      } else {
        const pool = config.weapon.subMode === "weapon" ? ALL_WEAPONS : Object.keys(DATA.weaponTypes);
        if (config.weapon.mode === "manual") {
          weaponAssignments = players.map(p => (config.weapon.manualValues && config.weapon.manualValues[p.id]) || pick(pool));
        } else {
          weaponAssignments = assignDistinct(pool, players.length);
        }
      }

      players.forEach((p, i) => {
        const side = sideAssignments[i];
        const role = roleAssignments[i];
        const weapon = weaponAssignments[i];
        result.players.push({
          id: p.id,
          nickname: p.nickname,
          side,
          role,
          weapon
        });
      });

      return result;
    }

    async function doRandomize() {
      if (!local.isHost) return;
      const room = local.room;
      room.result = rollResult(room.config, room.players);
      room.phase = "result";
      await writeRoom(room);
      local.room = room;
      render();
    }

    async function backToConfig() {
      if (!local.isHost) return;
      const room = local.room;
      room.phase = "configuring";
      await writeRoom(room);
      local.room = room;
      render();
    }

    function leaveRoom() {
      if (local.pollTimer) clearInterval(local.pollTimer);
      local.pollTimer = null;
      if (local.roomCode) clearStoredPlayerId(local.roomCode);
      clearActiveRoomCode();
      local.screen = "landing";
      local.tab = "create";
      local.room = null;
      local.roomCode = null;
      local.playerId = null;
      local.isHost = false;
      local.error = "";
      local.nickname = "";
      local.joinCode = "";
      render();
    }

    /* ---------------- rendering ---------------- */
    function render() {
      document.documentElement.lang = local.lang;
      const app = document.getElementById("app");
      if (local.screen === "landing") {
        app.innerHTML = renderLanding();
        bindLanding();
        bindLangSwitch();
        return;
      }
      if (!local.room) {
        app.innerHTML = `<div class="masthead"><h1>LOADOUT <span>DRAW</span></h1>${langSwitcherHtml()}</div><p class="hint">${t('loadingRoom')}</p>`;
        bindLangSwitch();
        return;
      }
      const phase = local.room.phase;
      let body = "";
      if (phase === "lobby") body = renderLobby();
      else if (phase === "configuring") body = renderConfig();
      else if (phase === "result") body = renderResult();

      app.innerHTML = `
    <div class="masthead">
      <h1>LOADOUT <span>DRAW</span></h1>
      <p>${t('roomLabel')} <strong style="color:var(--paper)">${local.room.code}</strong> · ${t('playersCount', local.room.players.length, MAX_PLAYERS)} ${local.isHost ? "· " + t('youAreHost') : ""}</p>
      ${langSwitcherHtml()}
    </div>
    ${body}
    <button class="btn ghost" id="leaveBtn">${t('leaveRoom')}</button>
  `;
      document.getElementById("leaveBtn").addEventListener("click", leaveRoom);
      bindLangSwitch();
      bindPhase(phase);
    }

    function renderLanding() {
      return `
    <div class="masthead">
      <h1>LOADOUT <span>DRAW</span></h1>
      <p>${t('subtitle')}</p>
      ${langSwitcherHtml()}
    </div>
    <div class="tabs">
      <button class="tab-btn ${local.tab === "create" ? "active" : ""}" data-tab="create">${t('tabCreate')}</button>
      <button class="tab-btn ${local.tab === "join" ? "active" : ""}" data-tab="join">${t('tabJoin')}</button>
    </div>
    <div class="panel" style="--accent:var(--red)">
      ${local.tab === "create" ? `
        <div class="field">
          <label>${t('yourNickname')}</label>
          <input id="nickInput" type="text" maxlength="20" placeholder="${escapeHtml(t('nicknamePlaceholder'))}" value="${escapeHtml(local.nickname)}">
        </div>
        <button class="btn" id="createBtn" ${local.busy ? "disabled" : ""}>${local.busy ? t('creating') : t('createRoomBtn')}</button>
      ` : `
        <div class="field">
          <label>${t('roomCodeField')}</label>
          <input id="codeInput" type="text" maxlength="5" placeholder="ABCDE" value="${escapeHtml(local.joinCode)}" style="text-transform:uppercase; letter-spacing:3px;">
        </div>
        <div class="field">
          <label>${t('yourNickname')}</label>
          <input id="nickInput" type="text" maxlength="20" placeholder="${escapeHtml(t('nicknamePlaceholder'))}" value="${escapeHtml(local.nickname)}">
        </div>
        <button class="btn" id="joinBtn" ${local.busy ? "disabled" : ""}>${local.busy ? t('joining') : t('joinRoomBtn')}</button>
      `}
      ${local.error ? `<div class="error">${escapeHtml(local.error)}</div>` : ""}
    </div>
  `;
    }

    function bindLanding() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => { local.tab = btn.dataset.tab; local.error = ""; render(); });
      });
      const nickInput = document.getElementById("nickInput");
      if (nickInput) nickInput.addEventListener("input", e => local.nickname = e.target.value);
      const codeInput = document.getElementById("codeInput");
      if (codeInput) codeInput.addEventListener("input", e => local.joinCode = e.target.value.toUpperCase());
      const createBtn = document.getElementById("createBtn");
      if (createBtn) createBtn.addEventListener("click", createRoom);
      const joinBtn = document.getElementById("joinBtn");
      if (joinBtn) joinBtn.addEventListener("click", joinRoom);
    }

    function renderLobby() {
      const room = local.room;
      const slots = [];
      for (let i = 0; i < MAX_PLAYERS; i++) {
        const p = room.players[i];
        if (p) {
          const isHostSlot = p.id === room.hostId;
          const isYou = p.id === local.playerId;
          slots.push(`<div class="slot filled ${isHostSlot ? "host-slot" : ""}">${escapeHtml(p.nickname)}${isHostSlot ? " ★" : ""}${isYou ? `<span class="you-tag">${t('you')}</span>` : ""}</div>`);
        } else {
          slots.push(`<div class="slot empty">${t('open')}</div>`);
        }
      }
      const full = room.players.length >= MAX_PLAYERS;

      return `
    <div class="code-display">
      <div><div class="code-label">${t('roomCodeShare')}</div><div class="code">${room.code}</div></div>
      <button class="copy-code-btn" id="copyCodeBtn" type="button" data-code="${escapeHtml(room.code)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="1"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
        <span id="copyCodeLabel">${t('copyCode')}</span>
      </button>
    </div>
    <div class="panel" style="--accent:var(--teal)">
      <div class="progress-label">${t('joined', room.players.length, MAX_PLAYERS)}</div>
      <div class="player-grid">${slots.join("")}</div>
      ${local.isHost ? `
        <button class="btn" id="configBtn" ${full ? "" : "disabled"}>
          ${full ? t('setupRandomizer') : t('waitingForMore', MAX_PLAYERS - room.players.length)}
        </button>
        ${!full && room.players.length >= 2 ? `<div><button class="btn ghost" id="skipBtn">${t('startNowWith', room.players.length)}</button></div>` : ""}
      ` : `<div class="hint">${t('waitingHostStart')}</div>`}
    </div>
  `;
    }

    async function copyRoomCode(code, btn) {
      const label = document.getElementById("copyCodeLabel");
      let ok = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(code);
          ok = true;
        }
      } catch (e) { /* fall through to legacy path below */ }
      if (!ok) {
        // Fallback for browsers/contexts without the async Clipboard API
        // (e.g. non-HTTPS, or older WebViews).
        try {
          const ta = document.createElement("textarea");
          ta.value = code;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ok = document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (e) { ok = false; }
      }
      if (ok && btn && label) {
        btn.classList.add("copied");
        const prevText = label.textContent;
        label.textContent = t('copyCodeCopied');
        setTimeout(() => {
          btn.classList.remove("copied");
          label.textContent = prevText;
        }, 1500);
      }
    }

    function bindPhase(phase) {
      if (phase === "lobby") {
        const configBtn = document.getElementById("configBtn");
        if (configBtn) configBtn.addEventListener("click", goToConfig);
        const skipBtn = document.getElementById("skipBtn");
        if (skipBtn) skipBtn.addEventListener("click", goToConfig);
        const copyCodeBtn = document.getElementById("copyCodeBtn");
        if (copyCodeBtn) copyCodeBtn.addEventListener("click", () => copyRoomCode(copyCodeBtn.dataset.code, copyCodeBtn));
      } else if (phase === "configuring") {
        bindConfig();
      } else if (phase === "result") {
        bindResult();
      }
    }

    function categoryOptionsFor(category, subMode) {
      if (category === "side") return DATA.sides;
      if (category === "map") return DATA.maps;
      if (category === "role") return subMode === "agent" ? ALL_AGENTS : Object.keys(DATA.roles);
      if (category === "weapon") return subMode === "weapon" ? ALL_WEAPONS : Object.keys(DATA.weaponTypes);
    }

    function renderConfig() {
      const room = local.room;
      const cfg = room.config;

      if (!local.isHost) {
        return `
      <div class="panel" style="--accent:var(--teal)">
        <div class="waiting-box">
          <div><span class="pulse"></span>${t('hostSettingUp')}</div>
        </div>
        <div class="readonly-config">
          ${configSummaryLine("side", cfg.side, null)}
          ${configSummaryLine("role", cfg.role, cfg.role.subMode)}
          ${configSummaryLine("weapon", cfg.weapon, cfg.weapon.subMode)}
          ${configSummaryLine("map", cfg.map, null)}
        </div>
      </div>
    `;
      }

      return `
    <div class="panel" style="--accent:var(--red)">
      <h3 style="margin-bottom:6px;">${t('setUpDraw')}</h3>
      <p class="hint" style="margin-top:0;">${t('setUpDrawHint')}</p>
      ${configRow("side", cfg.side, null, null, room.players)}
      ${configRow("role", cfg.role, cfg.role.subMode, [
        { key: "role", labelKey: "byRole" }, { key: "agent", labelKey: "byAgent" }
      ], room.players)}
      ${configRow("weapon", cfg.weapon, cfg.weapon.subMode, [
        { key: "type", labelKey: "byType" }, { key: "weapon", labelKey: "byWeapon" }
      ], room.players)}
      ${configRow("map", cfg.map, null, null, null)}
      <button class="btn" id="randomizeBtn" style="margin-top:16px;">${t('randomizeBtn')}</button>
    </div>
  `;
    }

    function configSummaryLine(category, catCfg, subMode) {
      let valueText;
      let icon = "";
      if (catCfg.mode === "off") {
        valueText = t('off');
      } else if (catCfg.mode === "manual") {
        if (category === "map") {
          valueText = catCfg.value ? translateOption(category, subMode, catCfg.value) : t('choose');
          icon = optionIcon(category, subMode, catCfg.value);
        } else {
          valueText = t('manualPerPlayer');
        }
      } else if (category === "side") {
        valueText = t('randomBalanced');
      } else {
        valueText = subMode ? (subMode === "agent" || subMode === "weapon" ? t('randomIndividual') : t('randomCategory')) : t('random');
      }
      return `<div><span>${t(category)}</span><span class="v">${icon}${escapeHtml(valueText)}</span></div>`;
    }

    function configRow(category, catCfg, subMode, subOptions, players) {
      const options = categoryOptionsFor(category, subMode);
      const isOff = catCfg.mode === "off";
      const isManual = catCfg.mode === "manual";
      const perPlayer = category !== "map"; // side/role/weapon assign per player; map is room-wide

      let valueArea;
      if (isOff) {
        valueArea = `<div class="hint" style="margin-top:0;">${t('notIncluded')}</div>`;
      } else if (isManual && perPlayer) {
        const manualValues = catCfg.manualValues || {};
        const sel = local.selectedChip;
        valueArea = `
          <div class="manual-dnd" data-manual-dnd="${category}">
            <p class="manual-dnd-hint">${t('dragHint')}</p>
            <div class="manual-options-pool">
              ${options.map(o => `
                <div class="option-chip ${sel && sel.category === category && sel.value === o ? "selected" : ""}"
                     draggable="true"
                     data-option-chip="${category}"
                     data-option-value="${escapeHtml(o)}">${optionIcon(category, subMode, o)}<span class="chip-label">${escapeHtml(translateOption(category, subMode, o))}</span></div>
              `).join("")}
            </div>
            <div class="manual-player-list">
              ${players.map(p => {
          const assigned = manualValues[p.id];
          return `
                <div class="manual-drop-zone ${assigned ? "filled" : ""}" data-manual-drop="${category}" data-player-id="${p.id}">
                  <span class="mpr-name">${escapeHtml(p.nickname)}</span>
                  <span class="mpr-value">${assigned ? optionIcon(category, subMode, assigned) + `<span>${escapeHtml(translateOption(category, subMode, assigned))}</span>` : `<span>${t('dropHere')}</span>`}</span>
                  ${assigned ? `<button type="button" class="mpr-clear" data-manual-clear="${category}" data-player-id="${p.id}" aria-label="${t('clearAssignment')}">×</button>` : ""}
                </div>
              `;
        }).join("")}
            </div>
          </div>
        `;
      } else if (isManual && !perPlayer) {
        // Map is room-wide (not per-player), so it's just a single click
        // to pick — no drag-and-drop needed. Clicking the already-chosen
        // tile again clears it back to unset.
        valueArea = `
          <div class="map-picker" data-map-picker="${category}">
            ${options.map(o => `
              <button type="button"
                      class="map-tile ${catCfg.value === o ? "selected" : ""}"
                      data-map-option="${escapeHtml(o)}">
                ${optionIcon(category, subMode, o)}<span class="chip-label">${escapeHtml(translateOption(category, subMode, o))}</span>
              </button>
            `).join("")}
          </div>
        `;
      } else {
        valueArea = `<div class="hint" style="margin-top:0;">${category === "side" ? t('teamsBalanced') : t('rolledAtRandomize')}</div>`;
      }

      return `
    <div class="config-row ${isOff ? "is-off" : ""} ${isManual ? "manual-expanded" : ""}">
      <div class="cat-name">${t(category)}</div>
      <div>
        <div class="mini-toggle" data-mode-toggle="${category}">
          <button data-mode="random" class="${catCfg.mode === "random" ? "active" : ""}">${t('random')}</button>
          <button data-mode="manual" class="${isManual ? "active" : ""}">${t('manual')}</button>
          <button data-mode="off" class="${isOff ? "active" : ""}">${t('off')}</button>
        </div>
        ${subOptions && !isOff ? `
          <div class="mini-toggle" data-sub-toggle="${category}" style="margin-top:6px;">
            ${subOptions.map(o => `<button data-sub="${o.key}" class="${subMode === o.key ? "active" : ""}">${t(o.labelKey)}</button>`).join("")}
          </div>
        ` : ""}
      </div>
      <div>
        ${valueArea}
      </div>
    </div>
  `;
    }

    function bindConfig() {
      document.querySelectorAll("[data-mode-toggle]").forEach(group => {
        const category = group.dataset.modeToggle;
        group.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => updateConfigMode(category, btn.dataset.mode));
        });
      });
      document.querySelectorAll("[data-sub-toggle]").forEach(group => {
        const category = group.dataset.subToggle;
        group.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => updateConfigSubMode(category, btn.dataset.sub));
        });
      });
      document.querySelectorAll("[data-map-picker]").forEach(picker => {
        const category = picker.dataset.mapPicker;
        picker.querySelectorAll("[data-map-option]").forEach(tile => {
          tile.addEventListener("click", () => {
            const value = tile.dataset.mapOption;
            const room = local.room;
            // Clicking the already-selected tile toggles it back off.
            const next = room.config[category].value === value ? "" : value;
            updateConfigValue(category, next);
          });
        });
      });
      bindManualDnd();
      const randomizeBtn = document.getElementById("randomizeBtn");
      if (randomizeBtn) randomizeBtn.addEventListener("click", doRandomize);
    }

    // Manual per-player assignment: an option "chip" can either be dragged
    // onto a player's drop zone (desktop mouse/pen), or tapped once to
    // select it and then landed by tapping a player (works everywhere,
    // including touch, where native HTML5 drag-and-drop is unreliable).
    function bindManualDnd() {
      document.querySelectorAll("[data-option-chip]").forEach(chip => {
        const category = chip.dataset.optionChip;
        const value = chip.dataset.optionValue;

        chip.addEventListener("dragstart", e => {
          e.dataTransfer.effectAllowed = "copy";
          e.dataTransfer.setData("text/plain", JSON.stringify({ category, value }));
          chip.classList.add("dragging");
        });
        chip.addEventListener("dragend", () => chip.classList.remove("dragging"));

        chip.addEventListener("click", () => {
          const sel = local.selectedChip;
          // Tapping the already-selected chip again deselects it.
          local.selectedChip = (sel && sel.category === category && sel.value === value)
            ? null
            : { category, value };
          render();
        });
      });

      document.querySelectorAll("[data-manual-drop]").forEach(zone => {
        const category = zone.dataset.manualDrop;
        const playerId = zone.dataset.playerId;

        zone.addEventListener("dragover", e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = "copy";
          zone.classList.add("drag-over");
        });
        zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
        zone.addEventListener("drop", e => {
          e.preventDefault();
          zone.classList.remove("drag-over");
          let payload;
          try { payload = JSON.parse(e.dataTransfer.getData("text/plain")); } catch (err) { return; }
          if (!payload || payload.category !== category) return;
          updateConfigManualValue(category, playerId, payload.value);
        });

        zone.addEventListener("click", () => {
          const sel = local.selectedChip;
          if (!sel || sel.category !== category) return;
          updateConfigManualValue(category, playerId, sel.value);
          local.selectedChip = null;
        });
      });

      document.querySelectorAll("[data-manual-clear]").forEach(btn => {
        const category = btn.dataset.manualClear;
        const playerId = btn.dataset.playerId;
        btn.addEventListener("click", e => {
          e.stopPropagation(); // don't let the click bubble to the drop zone's own handler
          updateConfigManualValue(category, playerId, "");
        });
      });
    }

    function playerResultCard(p, roleSubMode, weaponSubMode) {
      const isYou = p.id === local.playerId;
      const roleVal = p.role ? translateOption("role", roleSubMode, p.role) : null;
      const roleSub = p.role
        ? (roleSubMode === "agent" ? translateOption("role", "role", AGENT_ROLE[p.role]) : t('anyAgentInRole'))
        : null;
      const weaponVal = p.weapon ? translateOption("weapon", weaponSubMode, p.weapon) : null;
      const weaponSub = p.weapon
        ? (weaponSubMode === "weapon" ? translateOption("weapon", "type", WEAPON_TYPE[p.weapon]) : t('anyWeaponOfType'))
        : null;
      const sideLabel = p.side ? translateOption("side", null, p.side) : null;

      const rows = [
        p.role ? `<div class="pr-row">${optionIcon("role", roleSubMode, p.role)}<span class="pr-tag">${t('role')}</span><span class="pr-val">${escapeHtml(roleVal)}</span><span class="pr-sub">${escapeHtml(roleSub)}</span></div>` : "",
        p.weapon ? `<div class="pr-row">${optionIcon("weapon", weaponSubMode, p.weapon)}<span class="pr-tag">${t('weapon')}</span><span class="pr-val">${escapeHtml(weaponVal)}</span><span class="pr-sub">${escapeHtml(weaponSub)}</span></div>` : ""
      ].join("");

      return `
      <div class="player-result ${p.side ? "side-" + p.side.toLowerCase() : ""}">
        <div class="pr-name">${escapeHtml(p.nickname)}${isYou ? `<span class="you-tag">${t('you')}</span>` : ""}${p.side ? `<span class="side-tag side-${p.side.toLowerCase()}">${optionIcon("side", null, p.side)}${escapeHtml(sideLabel)}</span>` : ""}</div>
        ${rows || `<div class="pr-row"><span class="pr-sub">${t('noCategoriesRolled')}</span></div>`}
      </div>
    `;
    }

    function renderResult() {
      const r = local.room.result;

      const sideEnabled = r.players.some(p => p.side);

      let resultsHtml;
      if (sideEnabled) {
        // Attackers on the left, defenders on the right.
        const attackers = r.players.filter(p => p.side === "Attacker");
        const defenders = r.players.filter(p => p.side === "Defender");
        const unassigned = r.players.filter(p => p.side !== "Attacker" && p.side !== "Defender");
        resultsHtml = `
      <div class="side-columns">
        <div class="side-column">
          <div class="side-col-heading side-attacker">${t('attackers')}</div>
          ${attackers.map(p => playerResultCard(p, r.roleSubMode, r.weaponSubMode)).join("") || `<p class="hint">—</p>`}
        </div>
        <div class="side-column">
          <div class="side-col-heading side-defender">${t('defenders')}</div>
          ${defenders.map(p => playerResultCard(p, r.roleSubMode, r.weaponSubMode)).join("") || `<p class="hint">—</p>`}
        </div>
      </div>
      ${unassigned.length ? `<div class="player-results" style="margin-top:10px;">${unassigned.map(p => playerResultCard(p, r.roleSubMode, r.weaponSubMode)).join("")}</div>` : ""}
    `;
      } else {
        resultsHtml = `<div class="player-results">${r.players.map(p => playerResultCard(p, r.roleSubMode, r.weaponSubMode)).join("")}</div>`;
      }

      return `
    ${r.map ? `
    <div class="ticket">
      <h3 class="result-heading">${t('resultIsIn')}</h3>
      <div class="ticket-rows" style="grid-template-columns: 1fr;">
        <div class="ticket-item" style="border-left:none; padding-left:0;"><div class="tag">${t('map')}</div><div class="val">${optionIcon("map", null, r.map)}${escapeHtml(translateOption("map", null, r.map))}</div></div>
      </div>
    </div>
    ` : `<h3 class="result-heading">${t('resultIsIn')}</h3>`}
    ${resultsHtml}
    ${local.isHost ? `<button class="btn secondary" id="backBtn" style="margin-top:14px;">${t('adjustRandomizeAgain')}</button>` : `<p class="hint">${t('waitingHostRedraw')}</p>`}
  `;
    }

    function bindResult() {
      const backBtn = document.getElementById("backBtn");
      if (backBtn) backBtn.addEventListener("click", backToConfig);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }

    // Runs once on page load. If this browser was previously in a room
    // (tracked via getActiveRoomCode/getStoredPlayerId), try to silently
    // reconnect to it before showing the landing screen — this is what
    // makes a refresh or a reopened tab drop the player straight back into
    // their lobby instead of making them re-enter their nickname and code.
    // If a shared invite link brought the player here (e.g. ?code=ABCD)
    // and we're not silently rejoining anything, pre-fill the join tab
    // with that code so they just need to enter a nickname.
    function prefillJoinFromUrl() {
      let inviteCode;
      try {
        inviteCode = new URLSearchParams(window.location.search).get("code");
      } catch (e) { return; }
      if (!inviteCode) return;
      local.tab = "join";
      local.joinCode = inviteCode.trim().toUpperCase();
    }

    async function attemptRejoin() {
      const code = getActiveRoomCode();
      if (!code) { prefillJoinFromUrl(); render(); return; }
      const storedId = getStoredPlayerId(code);
      if (!storedId) { clearActiveRoomCode(); prefillJoinFromUrl(); render(); return; }

      // Show the existing "Loading room…" screen while we check the server.
      local.screen = "in-room";
      local.roomCode = code;
      local.room = null;
      render();

      const room = await readRoom(code);
      if (!room) {
        // Room no longer exists on the server (e.g. the host's lobby is
        // gone / it expired) — nothing to rejoin, so go back to landing.
        clearStoredPlayerId(code);
        clearActiveRoomCode();
        local.screen = "landing";
        local.roomCode = null;
        prefillJoinFromUrl();
        render();
        return;
      }

      const player = room.players.find(p => p.id === storedId);
      if (!player) {
        // We're no longer part of this room (removed, or it was reset).
        clearStoredPlayerId(code);
        clearActiveRoomCode();
        local.screen = "landing";
        local.roomCode = null;
        prefillJoinFromUrl();
        render();
        return;
      }

      local.playerId = storedId;
      local.roomCode = code;
      local.isHost = room.hostId === storedId;
      local.room = room;
      local.nickname = player.nickname;
      local.error = "";
      // Mark that we just synced with the server via this rejoin, so any
      // heartbeat logic doesn't treat this fresh state as stale and
      // immediately fire off another write on top of it.
      local.lastHeartbeatWrite = Date.now();
      startPolling();
      render();
    }

    attemptRejoin();
  </script>
</body>

</html>
